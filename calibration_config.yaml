# ── flat_world_calibrate.py configuration ─────────────────────────────────────

# Path to a saved image captured with the calibration setup in place.
# The image must show the ground mark (and optional tape measure) as placed
# during physical setup.  Capture it from the exact camera you are calibrating.
image_source: truck-centred.png

# Camera intrinsics YAML — ROS camera_info format (camera_matrix / distortion_coefficients)
# or simple format with keys K (3x3 flat) and D (distortion flat).
intrinsics_yaml: /home/rosey1211/.ros/camera_info/iphone_camera.yaml

# ── Physical measurements ──────────────────────────────────────────────────────

# Height of the camera optical centre above the ground plane (metres).
# Measure with a tape measure from the ground to the lens centre.
camera_height_m: 0.29

# Distance from the VEHICLE REFERENCE POINT (the same point camera_x_offset_m
# is measured from — usually rear axle centre) to the ground mark, along the
# ground (metres). Measuring from a point on the vehicle body is much easier
# in practice than trying to find the point directly below the camera.
# Keep the mark on the vehicle centreline (straight ahead).
mark_distance_m: 2.00

# Distance from the VEHICLE REFERENCE POINT to the tape, along the ground
# (metres) — same reference point as mark_distance_m and camera_x_offset_m.
# The tape does NOT need to be at the same distance as the ground mark —
# place it wherever is physically convenient, just measure and set this
# accurately. If omitted, defaults to mark_distance_m (i.e. assumes they're
# at the same distance). Getting this wrong makes the mark and tape
# inconsistent with any single camera pose, producing a very high fit RMS
# error when the tool refines pitch/roll/yaw.
tape_distance_m: 1.0

# Width of the horizontal tape measure used for roll calibration (metres).
# Set to 0.0 to skip roll calibration (roll will be assumed 0.0).
tape_width_m: 1.00

# Camera position relative to the vehicle reference point (usually rear axle centre).
# These are entered manually — no clicking required.
camera_x_offset_m: 0.25   # forward offset from reference point (metres)
camera_y_offset_m: 0.00   # lateral offset from vehicle centreline (metres, left = positive)

# ── Output ─────────────────────────────────────────────────────────────────────
output_yaml: flat_world_extrinsic.yaml

# Where 'i' saves the focal-length-adjusted intrinsics (ROS camera_info
# format, loadable as intrinsics_yaml here or in road_centerline_node).
# Only produced if the focal-length diagnostic has run (fit RMS > 5px).
# This is a derived, 3-point-diagnostic adjustment, not an independent
# recalibration — see _save_adjusted_intrinsics docstring.
output_intrinsics_yaml: adjusted_intrinsics.yaml
